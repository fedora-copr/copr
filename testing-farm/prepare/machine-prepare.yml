---
- name: Prepare the testing machine for running Copr tests
  hosts: all
  user: "root"

  vars:
    host_with_secrets: '{{ inventory_hostname }}'
    ansible_python_interpreter: /usr/bin/python3
    test_user: single-host-testing
    frontend_hostname: "{{ public_ip }}"
    backend_hostname: "{{ public_ip }}"
    distgit_hostname: "{{ public_ip }}"
    with_pulp: false

  pre_tasks:
    - name: Detect public IP address
      ansible.builtin.uri:
        url: https://ifconfig.me/ip
        return_content: true
        headers:
          Accept: text/plain
      register: public_ip_result

    - name: Set public_ip fact
      ansible.builtin.set_fact:
        public_ip: "{{ public_ip_result.content | trim }}"

    - name: Show detected public IP
      ansible.builtin.debug:
        msg: "Public IP: {{ public_ip }}"

  roles:
    - pre-release-packages
    - credentials
    - ca-trust
    - resalloc
    - distgit
    - role: pulp
      when: with_pulp | bool
    - backend
    - frontend
    - keygen
    - role: client
      vars:
        copr_username: "{{ test_user }}"

  handlers:
    - name: restart httpd
      ansible.builtin.systemd_service:
        name: httpd
        state: restarted
