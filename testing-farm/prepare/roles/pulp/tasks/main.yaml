---
- name: Fetch the Pulp admin password
  ansible.builtin.slurp:
    src: /root/pulp-admin-password
  delegate_to: "{{ host_with_secrets }}"
  register: pulp_admin_password
  no_log: true

- name: Fetch the Pulp SECRET_KEY
  ansible.builtin.slurp:
    src: /root/pulp-secret-key
  delegate_to: "{{ host_with_secrets }}"
  register: pulp_secret_key
  no_log: true

- name: Start Pulp container
  containers.podman.podman_container:
    name: pulp
    image: ghcr.io/pulp/pulp:latest
    state: started
    env:
      PULP_DEFAULT_ADMIN_PASSWORD: "{{ pulp_admin_password['content'] | b64decode }}"
      PULP_SECRET_KEY: "{{ pulp_secret_key['content'] | b64decode }}"
    ports:
      - "5006:80"
    device:
      - /dev/fuse:/dev/fuse
  no_log: true

- name: Wait for Pulp to become ready
  ansible.builtin.uri:
    url: http://localhost:5006/pulp/api/v3/status/
    method: GET
    status_code: 200
  register: pulp_status
  until: pulp_status.status == 200
  retries: 60
  delay: 5
