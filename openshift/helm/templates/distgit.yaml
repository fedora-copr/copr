# vi: ft=yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-distgit-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "3Gi"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-distgit-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Gi"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-distgit-locks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "10M"

---
apiVersion: v1
kind: Secret
metadata:
  name: distgit-config
type: Opaque
data:
  dist-git.conf: {{ tpl (.Files.Get "config/distgit-distgit.conf.j2") . | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: distgit-copr-config
type: Opaque
data:
  copr-dist-git.conf: {{ tpl (.Files.Get "config/distgit-copr.conf.j2") . | b64enc | quote }}

---
apiVersion: v1
kind: Service
metadata:
  name: copr-distgit
spec:
  ports:
    - name: copr-distgit-http
      port: 5001
      targetPort: 5001
  selector:
    name: copr-distgit

---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: copr-distgit
spec:
  tags:
    - from:
        kind: DockerImage
        name: quay.io/copr/distgit:test
      importPolicy:
        scheduled: true
      name: test

---
kind: DeploymentConfig
apiVersion: apps.openshift.io/v1
metadata:
  name: copr-distgit
spec:
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        name: copr-distgit
    spec:
      containers:
        - name: imports
          image: {{ .Values.copr_distgit_image | quote }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml .Values.resources.distgit.imports | indent 12 }}
          volumeMounts:
            - name: distgit-copr-config
              mountPath: /etc/copr
            - name: distgit-config
              mountPath: /etc/dist-git
            - name: storage
              mountPath: /var/lib/dist-git
            - name: logs
              mountPath: /var/lib/copr-dist-git
            - name: logs
              mountPath: /var/log/copr-dist-git
            - name: locks
              mountPath: /var/lock/copr-dist-git

        - name: httpd
          image: {{ .Values.copr_distgit_image | quote }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml .Values.resources.distgit.httpd | indent 12 }}
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: distgit-copr-config
              mountPath: /etc/copr
            - name: distgit-config
              mountPath: /etc/dist-git
            - name: storage
              mountPath: /var/lib/dist-git
            - name: logs
              mountPath: /var/lib/copr-dist-git
            - name: logs
              mountPath: /var/log/copr-dist-git
            - name: logs
              mountPath: /var/log/httpd
          command: ["/usr/sbin/httpd", "-DFOREGROUND"]

      volumes:
        - name: distgit-config
          secret:
            secretName: distgit-config
            optional: false

        - name: distgit-copr-config
          secret:
            secretName: distgit-copr-config
            optional: false

        - name: storage
          persistentVolumeClaim:
            claimName: copr-distgit-data

        - name: logs
          persistentVolumeClaim:
            claimName: copr-distgit-logs

        - name: locks
          persistentVolumeClaim:
            claimName: copr-distgit-locks

      restartPolicy: Always

  replicas: 1
  strategy:
    type: Recreate
    resources:
{{ toYaml .Values.resources.distgit.strategy | indent 6 }}

  triggers:
    - imageChangeParams:
        automatic: true
        containerNames:
          - imports
          - httpd
        from:
          kind: ImageStreamTag
          name: copr-distgit:test
      type: ImageChange

    - type: ConfigChange

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: copr-distgit
spec:
  port:
    targetPort: copr-distgit-http
  to:
    kind: Service
    name: copr-distgit
