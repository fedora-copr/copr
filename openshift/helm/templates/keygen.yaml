# vi: ft=yaml
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: copr-keygen
spec:
  tags:
    - from:
        kind: DockerImage
        name: quay.io/copr/keygen:test
      importPolicy:
        scheduled: true
      name: test

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-keygen-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Gi"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-keygen-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: copr-keygen
spec:
  ports:
    - name: copr-keygen-httpd
      port: 5003
      targetPort: 5003
    - name: copr-keygen-signd
      port: 5167
      targetPort: 5167
  selector:
    name: copr-keygen

---
kind: DeploymentConfig
apiVersion: apps.openshift.io/v1
metadata:
  name: copr-keygen
spec:
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        name: copr-keygen
    spec:
      containers:
        - name: signer
          image: {{ .Values.copr_keygen_image | quote }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml .Values.resources.keygen.signer | indent 12 }}
          command: ["/usr/bin/tini", "--"]
          args: ["/signd-entrypoint", "0.0.0.0/0"]
          volumeMounts:
            - name: storage
              mountPath: /var/lib/copr-keygen
            - name: logs
              mountPath: /var/log/copr-keygen
          ports:
            - containerPort: 5167
              protocol: TCP

        - name: httpd
          image: {{ .Values.copr_keygen_image | quote }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml .Values.resources.keygen.httpd | indent 12 }}
          command: ["/usr/sbin/httpd", "-DFOREGROUND"]
          volumeMounts:
            - name: storage
              mountPath: /var/lib/copr-keygen
            - name: logs
              mountPath: /var/log/copr-keygen
          ports:
            - containerPort: 5003
              protocol: TCP

      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: copr-keygen-data
        - name: logs
          persistentVolumeClaim:
            claimName: copr-keygen-logs

      restartPolicy: Always

  replicas: 1
  strategy:
    type: Recreate
    resources:
{{ toYaml .Values.resources.keygen.strategy | indent 6 }}

  triggers:
    - imageChangeParams:
        automatic: true
        containerNames:
          - signer
          - httpd
        from:
          kind: ImageStreamTag
          name: copr-keygen:test
      type: ImageChange

    - type: ConfigChange
