# vim: ft=yaml

---
apiVersion: v1
kind: Secret
metadata:
  name: copr-frontend-config
type: Opaque
data:
  copr.conf: {{ tpl (.Files.Get "config/frontend-copr.conf") . | b64enc | quote }}

---
apiVersion: v1
kind: Service
metadata:
  name: copr-frontend
spec:
  ports:
    - name: copr-frontend-httpd
      port: 5000
      targetPort: 5000
  selector:
    name: copr-frontend

---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: copr-frontend
spec:
  tags:
    - from:
        kind: DockerImage
        name: quay.io/copr/frontend:test
      importPolicy:
        scheduled: true
      name: test

---
kind: DeploymentConfig
apiVersion: apps.openshift.io/v1
metadata:
  name: copr-frontend
spec:
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        name: copr-frontend
    spec:
      containers:
        - name: copr-frontend
          image: {{ .Values.copr_frontend_image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              protocol: TCP
          resources:
{{ toYaml .Values.resources.frontend.app | indent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: 5000
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: copr-frontend-config
              mountPath: /etc/copr
      volumes:
        - name: copr-frontend-config
          secret:
            secretName: copr-frontend-config
            optional: false

  replicas: 1
  strategy:
    type: Recreate
    resources:
{{ toYaml .Values.resources.frontend.strategy | indent 6 }}

  triggers:
    - imageChangeParams:
        automatic: true
        containerNames:
          - copr-frontend
        from:
          kind: ImageStreamTag
          name: copr-frontend:test
      type: ImageChange
    - type: ConfigChange

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: copr-frontend
spec:
  port:
    targetPort: copr-frontend-httpd
  to:
    kind: Service
    name: copr-frontend
