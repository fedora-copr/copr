# vi: ft=yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-backend-results
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "3Gi"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-backend-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Gi"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-backend-locks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "10M"

---
apiVersion: v1
kind: Secret
metadata:
  name: copr-backend-config
type: Opaque
data:
  copr-be.conf: {{ tpl (.Files.Get "config/backend-copr-be.conf") . | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-home
type: Opaque
stringData:
  id_rsa: {{ .Values.aws_config.ssh_key.private | quote }}
  ssh_config: |
    Host *
       IdentityFile ~/.ssh/id_rsa
       StrictHostKeyChecking  no
       UserKnownHostsFile /dev/null
       ServerAliveInterval 20
       ServerAliveCountMax 5
       ConnectTimeout 60

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: copr-backend-httpd-config
data:
  copr-be.conf: |
{{ .Files.Get "config/backend-nginx.conf" | indent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: copr-backend
spec:
  ports:
    - name: copr-backend-httpd
      port: 5002
      targetPort: 5002
  selector:
    name: copr-backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-backend
  labels:
    app: copr
    component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: copr-backend
  template:
    metadata:
      labels:
        name: copr-backend
        app: copr
        component: backend
    spec:
      containers:
        - name: log
          image: {{ .Values.copr_backend_image }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml .Values.resources.backend.log | indent 12 }}
          command: ["/usr/bin/tini", "--"]
          args: ["/usr/bin/copr_run_logger.py"]
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "copr_run_logger"]
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/copr
            - name: logs
              mountPath: /var/log/copr-backend

        - name: actions
          image: {{ .Values.copr_backend_image }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml .Values.resources.backend.actions | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/copr
            - name: results
              mountPath: /var/lib/copr/public_html
            - name: locks
              mountPath: /var/lock/copr-backend
          command: ["/usr/bin/tini", "--"]
          args: ["/run-backend", "--sign-host", "copr-keygen", "/usr/bin/copr-run-dispatcher-backend", "actions"]
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "copr-run-dispatcher"]
            initialDelaySeconds: 10
            periodSeconds: 30

        - name: builds
          image: {{ .Values.copr_backend_image }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml .Values.resources.backend.builds | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/copr
            - name: results
              mountPath: /var/lib/copr/public_html
            - name: locks
              mountPath: /var/lock/copr-backend
            - name: home
              mountPath: /backend-home
          env:
            - name: HOME
              value: /backend-home
          command: ["/usr/bin/tini", "--"]
          args: ["/run-backend", "--sign-host", "copr-keygen", "/usr/bin/copr-run-dispatcher-backend", "builds"]
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "copr-run-dispatcher"]
            initialDelaySeconds: 10
            periodSeconds: 30

        - name: httpd
          image: {{ .Values.nginx_image }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml .Values.resources.backend.httpd | indent 12 }}
          ports:
            - containerPort: 5002
              protocol: TCP
          command: ["nginx", "-g", "daemon off;"]
          readinessProbe:
            httpGet:
              path: /
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: results
              mountPath: /var/lib/copr/public_html
            - name: httpd-config
              mountPath: /opt/app-root/etc/nginx.d/copr-be.conf
              subPath: copr-be.conf

      volumes:
        - name: config
          secret:
            secretName: copr-backend-config
            optional: false

        - name: home
          secret:
            secretName: backend-home
            optional: false
            defaultMode: 0600
            items:
              - key: id_rsa
                path: .ssh/id_rsa
              - key: ssh_config
                path: .ssh/config

        - name: httpd-config
          configMap:
            name: copr-backend-httpd-config

        - name: logs
          persistentVolumeClaim:
            claimName: copr-backend-logs

        - name: results
          persistentVolumeClaim:
            claimName: copr-backend-results

        - name: locks
          persistentVolumeClaim:
            claimName: copr-backend-locks

      restartPolicy: Always

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: copr-backend
spec:
  port:
    targetPort: copr-backend-httpd
  to:
    kind: Service
    name: copr-backend
