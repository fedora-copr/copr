---
apiVersion: v1
kind: Secret
metadata:
  name: resalloc-config
type: Opaque
data:
  pools.yaml: {{ tpl (.Files.Get "config/resalloc-pool.yaml.j2") . | b64enc | quote }}
  server.yaml: {{ tpl (.Files.Get "config/resalloc-server.yaml.j2") . | b64enc | quote }}
  spinup-playbook.yml: {{ tpl (.Files.Get "config/resalloc-spinup-playbook.yml.j2") . | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: resalloc-home
type: Opaque
data:
  aws_config: W2RlZmF1bHRdCnJlZ2lvbiA9IHVzLWVhc3QtMQo=
  aws_credentials: {{ tpl (.Files.Get "config/resalloc-aws-credentials.j2") . | b64enc | quote }}
  id_rsa: {{ .Values.aws_config.ssh_key.private | toString | b64enc | quote }}
  ssh_config: SG9zdCAqCiAgIElkZW50aXR5RmlsZSB+Ly5zc2gvaWRfcnNhCiAgIFN0cmljdEhvc3RLZXlDaGVja2luZyAgbm8KICAgVXNlcktub3duSG9zdHNGaWxlIC9kZXYvbnVsbAogICBTZXJ2ZXJBbGl2ZUludGVydmFsIDIwCiAgIFNlcnZlckFsaXZlQ291bnRNYXggNQogICBDb25uZWN0VGltZW91dCA2MAo=

  ansible_conf: {{ "[defaults]\nlocal_tmp=/tmp/.ansible\n[ssh_connection]\ncontrol_path_dir=/tmp/.ansible\n" | b64enc | quote }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resalloc-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: resalloc
spec:
  ports:
    - name: resalloc
      port: 49100
      targetPort: 49100
  selector:
    name: resalloc


---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: resalloc
spec:
  tags:
    - from:
        kind: DockerImage
        name: quay.io/copr/resalloc:test
      importPolicy:
        scheduled: true
      name: test

---
kind: DeploymentConfig
apiVersion: apps.openshift.io/v1
metadata:
  name: resalloc
spec:
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        name: resalloc
    spec:
      containers:
        - name: server
          image: {{ .Values.resalloc_image | quote }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml .Values.resources.resalloc.app | indent 12 }}
          volumeMounts:
            - name: resalloc-data
              mountPath: /var/lib/resallocserver
            - name: resalloc-data
              mountPath: /var/log/resallocserver
            - name: resalloc-config
              mountPath: /etc/resallocserver
            - name: resalloc-home
              mountPath: /resalloc-home
          env:
            - name: CONFIG_DIR
              value: /etc/resallocserver
            - name: HOME
              value: /resalloc-home

          command: ["/usr/bin/resalloc-server"]
          readinessProbe:
            tcpSocket:
              port: 49100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 49100
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5

      volumes:
        - name: resalloc-config
          secret:
            secretName: resalloc-config
            optional: false

        - name: resalloc-home
          secret:
            secretName: resalloc-home
            optional: false
            defaultMode: 0600
            items:
              - key: aws_config
                path: .aws/config
              - key: aws_credentials
                path: .aws/credentials
              - key: id_rsa
                path: .ssh/id_rsa
              - key: ssh_config
                path: .ssh/config
              - key: ansible_conf
                path: .ansible.cfg

        - name: resalloc-data
          persistentVolumeClaim:
            claimName: resalloc-data

      restartPolicy: Always

  replicas: 1
  strategy:
    type: Recreate
    resources:
{{ toYaml .Values.resources.resalloc.strategy | indent 6 }}

  triggers:
    - imageChangeParams:
        automatic: true
        containerNames:
          - server
        from:
          kind: ImageStreamTag
          name: resalloc:test
      type: ImageChange

    - type: ConfigChange

# vim: ft=yaml
