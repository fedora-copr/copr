---
# Default chart values. Put private deployment overrides into secrets.yaml.

project: copr-dev
create_project: false
deployment: dev

postgres_user: copr-fe
postgres_password: ""
postgres_database_name: copr-db

frontend_backend_password: ""

frontend_base_url: http://copr-frontend:5000
distgit_fqdn: copr-distgit
backend_fqdn: copr-backend

# Empty PostgreSQL/Redis images preserve the legacy ImageStream trigger flow.
postgresql_image: ""
redis_image: ""
copr_frontend_image: quay.io/copr/frontend:test
copr_backend_image: quay.io/copr/backend:test
nginx_image: quay.io/copr/backend-httpd:test
copr_distgit_image: quay.io/copr/distgit:test
resalloc_image: quay.io/copr/resalloc:test
copr_keygen_image: quay.io/copr/keygen:test

aws_config:
  access_key_id: ""
  secret_access_key: ""
  ssh_key:
    name: ""
    private: ""
    public: ""

# Conservative defaults, sized for a small stage/dev deployment.
# Override per-environment via a values file.
resources:
  backend:
    log: &small_app
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    actions: *small_app
    builds: *small_app
    httpd: *small_app
    strategy: &rollout
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  frontend:
    app: &medium_app
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    strategy: *rollout

  distgit:
    imports: *medium_app
    httpd: *small_app
    strategy: *rollout

  keygen:
    signer: *small_app
    httpd: *small_app
    strategy: *rollout

  resalloc:
    app: *small_app
    strategy: *rollout

  postgres:
    app: *medium_app
    strategy: *rollout

  redis:
    app: *small_app
    strategy: *rollout
