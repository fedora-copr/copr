# This stack is for local development. The public local-only credentials below
# are Compose defaults, not image defaults. Production Helm supplies its own secrets.
#
# Port-layout
# ===========
#
# Rootless podman-compose doesn't allow us to start multiple containers in one
# pod that listen on the same port.  Therefore we start httpd servers on ports
# (host:pod):
#   5000:5000 -- Frontend Apache (API/WebUI)
#   5001:5001 -- DistGit Apache
#   5002:5002 -- Backend Nginx
#     --:5003 -- Keygen Apache (obtaining keys)
#   5005:5000 -- Resalloc WebUI
#
# Other ports:
#   5009:5432 -- PostgreSQL database

# this should be dolved by python3-daemon >= 3.0.0
# https://bugzilla.redhat.com/show_bug.cgi?id=2307635
x-ulimits: &ulimits_settings
  ulimits:
    nproc: 65535
    nofile:
      soft: 32767
      hard: 65535


services:

  backend-ssh-init:
    build:
      context: docker/backend
    user: root
    command:
      - /bin/sh
      - -ec
      - |
        cp /local/id_rsa /ssh/id_rsa
        cp /home/copr/.ssh/builder_config /ssh/builder_config
        chown -R copr:copr /ssh
        chmod 700 /ssh
        chmod 600 /ssh/id_rsa /ssh/builder_config
    volumes:
      - ./.copr-compose/id_rsa:/local/id_rsa:ro,z
      - backend-ssh:/ssh

  # @TODO Probably not all backend services should use the same Dockerfile

  backend-log:
    build:
      context: docker/backend
    hostname: backend-log
    command: "/usr/bin/copr_run_logger.py"
    depends_on:
      - redis
    stdin_open: true
    tty: true
    volumes:
      - .:/opt/copr:z
      - results:/var/lib/copr/public_html/results:z
    configs:
      - source: backend-config
        target: /etc/copr/copr-be.conf
    <<: *ulimits_settings

  backend-build:
    build:
      context: docker/backend
    hostname: backend-build
    command: ["/run-backend", "--sign-host", "keygen-signd", "/usr/bin/copr-run-dispatcher-backend", "builds"]
    depends_on:
      resalloc:
        condition: service_started
      backend-ssh-init:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    volumes:
      - .:/opt/copr:z
      - results:/var/lib/copr/public_html/results:z
      - backend-ssh:/home/copr/.ssh:ro
    configs:
      - source: backend-config
        target: /etc/copr/copr-be.conf
      - source: pulp-cli-config
        target: /home/copr/.config/pulp/cli.toml
    <<: *ulimits_settings

  backend-action:
    build:
      context: docker/backend
    hostname: backend-action
    command: ["/run-backend", "--sign-host", "keygen-signd", "/usr/bin/copr-run-dispatcher-backend", "actions"]
    depends_on:
      - resalloc
    stdin_open: true
    tty: true
    volumes:
      - .:/opt/copr:z
      - results:/var/lib/copr/public_html/results:z
    configs:
      - source: backend-config
        target: /etc/copr/copr-be.conf
      - source: pulp-cli-config
        target: /home/copr/.config/pulp/cli.toml
    <<: *ulimits_settings

  resalloc:
    build:
      context: docker/resalloc
    hostname: resalloc
    depends_on:
      - database
    stdin_open: true
    tty: true
    volumes:
      - resalloc:/persistent:z

  resalloc-webui:
    build:
      context: docker/resalloc
    hostname: resalloc-webui
    depends_on:
      - resalloc
    command: python3 -c "from resallocwebui.app import app; app.run(host='0.0.0.0')"
    stdin_open: true
    tty: true
    ports:
      - "5005:5000"
    volumes:
      - resalloc:/persistent:z

  redis:
    image: centos/redis-32-centos7
    hostname: redis
    volumes:
      - redis:/var/lib/redis/data

  backend_httpd:
    image: quay.io/sclorg/nginx-126-c10s
    hostname: backend_httpd
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5002/"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5002:5002"
    volumes:
      - results:/var/lib/copr/public_html/results:z
    configs:
      - source: backend-httpd-config
        target: /opt/app-root/etc/nginx.d/copr-be.conf

  builder:
    build:
      context: docker/builder
    hostname: builder
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - .:/opt/copr:z
      - ./.copr-compose/id_rsa.pub:/run/builder-authorized-keys:ro,z

  frontend:
    build:
      context: docker/frontend/
    hostname: frontend
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    stdin_open: true
    tty: true
    environment:
      COPR_FRONTEND_ENV: local
      COPR_FRONTEND_DEBUG: "true"
      TEST_REMOTE_USER: jdoe
      COPR_BACKEND_PASSWORD: local-only-backend-password
      COPR_FRONTEND_SECRET_KEY: local-only-frontend-session-secret-do-not-use-outside-development
      COPR_DATABASE_URI: postgresql+psycopg2://copr-fe:local-only-database-password@database/coprdb
    ports:
      - "5000:5000"
    volumes:
      - .:/opt/copr:z

  database:
    image: quay.io/sclorg/postgresql-18-c10s
    hostname: database
    stdin_open: true
    tty: true
    environment:
      POSTGRESQL_USER: copr-fe
      POSTGRESQL_PASSWORD: local-only-database-password
      POSTGRESQL_DATABASE: coprdb
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRESQL_USER" -d "$$POSTGRESQL_DATABASE"']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - 5009:5432
    volumes:
      - database:/var/lib/pgsql/data

  distgit:
    build:
      context: docker/distgit/
    hostname: distgit
    depends_on:
      backend_httpd:
        condition: service_healthy
    stdin_open: true
    tty: true
    volumes:
      - .:/opt/copr:z
      - dist-git:/var/lib/dist-git:z
    configs:
      - source: distgit-config
        target: /etc/copr/copr-dist-git.conf
    <<: *ulimits_settings

  distgit-httpd:
    build:
      context: docker/distgit/
    hostname: distgit-httpd
    stdin_open: true
    tty: true
    ports:
      - "5001:5001"
    volumes:
      - .:/opt/copr:z
      - dist-git:/var/lib/dist-git:z
    configs:
      - source: distgit-config
        target: /etc/copr/copr-dist-git.conf
    command: /usr/sbin/httpd -DFOREGROUND
    <<: *ulimits_settings

  keygen-signd:
    build:
      context: docker/keygen/
    hostname: keygen-signd
    stdin_open: true
    tty: true
    volumes:
      - .:/opt/copr:z
      - copr-keygen:/var/lib/copr-keygen:z
    command: /signd-entrypoint

  keygen-httpd:
    build:
      context: docker/keygen/
    hostname: keygen-httpd
    stdin_open: true
    tty: true
    volumes:
      - .:/opt/copr:z
      - copr-keygen:/var/lib/copr-keygen:z

  pulp:
    image: ghcr.io/pulp/pulp:latest
    hostname: pulp
    stdin_open: true
    tty: true
    environment:
      PULP_DEFAULT_ADMIN_PASSWORD: local-only-pulp-password
      PULP_SECRET_KEY: local-only-pulp-secret-do-not-use-outside-this-development-stack
    ports:
      - 5006:80
    volumes:
      - pulp-storage:/var/lib/pulp:Z
      - pulp-database:/var/lib/pgsql
    devices:
      - /dev/fuse:/dev/fuse


# Runtime configs are interpolated by Compose, never copied into image layers.
configs:
  backend-httpd-config:
    file: ./docker/backend_httpd/files/etc/nginx/conf.d/copr-be.conf

  backend-config:
    content: |
      [backend]
      build_user=root
      results_baseurl=http://backend_httpd:5002/results/
      frontend_base_url=http://frontend:5000
      frontend_auth=local-only-backend-password
      dist_git_url=http://distgit-httpd/cgit
      destdir=/var/lib/copr/public_html/results
      sleeptime=30
      resalloc_connection=http://resalloc:49100
      do_sign=true
      keygen_host=keygen-httpd:5003
      prune_days=14
      redis_host=redis
      redis_port=6379
      pulp_content_url=http://pulp:80/pulp/content
      [builder]
      timeout=3600
      builder_perl=True
      [ssh]
      builder_config=/home/copr/.ssh/builder_config
  distgit-config:
    content: |
      [dist-git]
      frontend_base_url=http://frontend:5000
      frontend_auth=local-only-backend-password
      per_task_log_dir=/var/lib/dist-git/per-task-logs
      redis_host=redis
      redis_port=6379
  pulp-cli-config:
    content: |
      [cli]
      base_url = "http://pulp:80"
      api_root = "/pulp/"
      domain = "default"
      username = "admin"
      password = "local-only-pulp-password"
      verify_ssl = true

volumes:
  backend-ssh:
  results:
  copr-keygen:
  dist-git:
  database:
  redis:
  resalloc:
  pulp-storage:
  pulp-database:
